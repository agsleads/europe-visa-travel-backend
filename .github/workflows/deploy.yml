name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Two deploys of the same branch must not interleave. Not cancel-in-progress:
# killing a release mid-rollback would leave the host in an unknown state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build and push image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy, health-check, roll back on failure
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Release over SSH
        env:
          DEPLOY_HOST:        ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY:     ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts

          # The key is pinned server-side to a single forced command, so the
          # only thing we can influence is the image tag - which the server
          # also validates against this app's own GHCR repository.
          set +e
          OUTPUT=$(printf 'IMAGE=%s\nTOKEN=%s\nACTOR=%s\n' \
                     "${IMAGE}:${GITHUB_SHA}" "$GHCR_TOKEN" "$GITHUB_ACTOR" \
                   | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 \
                         deploy@"$DEPLOY_HOST" 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          case "$OUTPUT" in
            *DEPLOY_OK*)
              echo "::notice::Deployed ${IMAGE}:${GITHUB_SHA}" ;;
            *DEPLOY_FAILED_MIGRATION*)
              echo "::error::Database migration failed. Nothing was deployed; the previous version is still serving."; exit 1 ;;
            *DEPLOY_FAILED_ROLLED_BACK*)
              echo "::error::Health check failed. Previous version restored."; exit 1 ;;
            *ROLLBACK_FAILED*)
              echo "::error::Deploy AND rollback failed - europe-visa-travel-backend is down."; exit 1 ;;
            *)
              echo "::error::Deploy did not report success (ssh exit $STATUS)."; exit 1 ;;
          esac
